<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عدم دسترسی به اینترنت | ابدالی و جوشقانی</title>
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #fdfbf7;

            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .box { max-width: 420px; }
        i { font-size: 3rem; color: #c5a059; margin-bottom: 20px; display: block; }
        h1 { font-size: 1.3rem; margin-bottom: 10px; }
        p { color: #595048; font-size: 0.95rem; line-height: 1.8; }
        button {
            margin-top: 20px; padding: 10px 24px; border: none;
            background: #102a43; color: #fff; border-radius: 8px;
            font-family: inherit; font-size: 0.9rem; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <i>⚠️</i>
        <h1>اتصال اینترنت برقرار نیست</h1>
        <p>به نظر می‌رسد دسترسی به اینترنت قطع شده است. لطفاً اتصال خود را بررسی کرده و دوباره تلاش کنید.</p>
        <button onclick="window.location.reload()">تلاش مجدد</button>
    </div>

</html>
